[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-search-app"
version = "1.1.0"
description = "Flask + SQLAlchemy flight search app with multi-table queries and admin auth."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.0",
    "Flask-Login>=0.6.3",
    "PyMySQL>=1.1.0",
    "python-dotenv>=1.0.0",
    "Werkzeug>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
    "ruff",
    "build",
]

[project.scripts]
flights-app = "src.run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["F", "E9", "I", "UP", "B"]
ignore = ["E501", "F821"]
# F821 is exempt because SQLAlchemy's `Mapped["Model"]` quoted forward
# references are valid and resolved by the ORM at runtime (not undefined names).